<nav #bar class="page-nav" [attr.aria-label]="navLabel()">
  <a class="page-nav__brand" [href]="brandHref()" [attr.aria-label]="brandAriaLabel()">
    <div class="page-nav__brand-text">
      <span class="page-nav__brand-name">{{ brandName() }}</span>
      <span class="page-nav__brand-sub">{{ brandSubtitle() }}</span>
    </div>
  </a>

  <ul class="page-nav__links" role="list">
    @for (link of links(); track $index) {
      <li>
        <a class="page-nav__link" [href]="link.href">{{ link.label }}</a>
      </li>
    }
  </ul>

  <div class="page-nav__actions">
    <ng-content />
    <button class="page-nav__cta" type="button" (click)="ctaClick.emit()">
      {{ ctaLabel() }}
    </button>
    <ds-page-nav-menu
      [links]="links()"
      [ctaLabel]="ctaLabel()"
      [menuLabel]="menuLabel()"
      (ctaClick)="ctaClick.emit()"
    />
  </div>
</nav>
