<ul class="striped-list" role="list">
  @for (item of items(); track $index) {
    <li class="striped-list__item">
      <span class="striped-list__index" aria-hidden="true">{{ item.index }}</span>
      <span class="striped-list__name">{{ item.name }}</span>
      <p class="striped-list__description">{{ item.description }}</p>
      @if (showArrow()) {
        <span class="striped-list__arrow" aria-hidden="true">→</span>
      }
    </li>
  }
</ul>
