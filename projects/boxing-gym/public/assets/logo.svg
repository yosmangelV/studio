<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 88" fill="none">
  <!-- Red left accent bar -->
  <rect x="0" y="8" width="4" height="72" fill="#C41230"/>

  <!-- "El Arte del" — light weight, muted -->
  <text
    x="18" y="42"
    font-family="'Oswald', 'Impact', 'Arial Narrow', Arial, sans-serif"
    font-size="22"
    font-weight="300"
    fill="rgba(250,250,250,0.4)"
    letter-spacing="5"
  >EL ARTE DEL</text>

  <!-- "GUANTE" — heavy -->
  <text
    x="18" y="82"
    font-family="'Oswald', 'Impact', 'Arial Narrow', Arial, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#FAFAFA"
    letter-spacing="2"
  >GUANTE</text>

  <!-- Thin red line separator -->
  <line x1="18" y1="50" x2="282" y2="50" stroke="#C41230" stroke-width="0.75" opacity="0.25"/>
</svg>
