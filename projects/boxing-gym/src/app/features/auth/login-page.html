<div class="login">

  <!-- ── Left: Brand panel ──────────────────────────────────────── -->
  <div class="login__brand" aria-hidden="true">
    <div class="login__brand-bg">
      <div class="login__brand-spotlight"></div>
      <div class="login__brand-grid"></div>
    </div>
    <img class="login__brand-img" [src]="config.assets.logoIllustrated" alt="" />
    <div class="login__brand-content">
      <p class="login__brand-eyebrow">
        <span class="login__brand-eyebrow-line"></span>
        {{ config.subtitle }}
      </p>
      <div class="login__brand-headline">
        <span class="login__brand-headline-top">{{ headlineTop }}</span>
        <span class="login__brand-headline-main">{{ headlineMain }}</span>
      </div>
    </div>
  </div>

  <!-- ── Right: Form panel ─────────────────────────────────────── -->
  <div class="login__panel">
    <div class="login__form-wrap">

      <div class="login__form-header">
        <p class="login__form-eyebrow">
          <span class="login__form-eyebrow-line"></span>
          <span i18n="@@login.eyebrow">Panel de Administración</span>
        </p>
        <h1 class="login__form-title">
          <span i18n="@@login.title">Iniciar</span>
          <span class="login__form-title--accent" i18n="@@login.titleAccent">Sesión</span>
        </h1>
      </div>

      <form
        class="login__form"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        novalidate
        data-testid="login-form"
      >
        <ds-form-field
          label="Email" i18n-label="@@login.email.label"
          inputId="login-email"
          [hasError]="emailInvalid()"
          errorMessage="Introduce un email válido" i18n-errorMessage="@@login.email.error"
        >
          <ds-input
            inputId="login-email"
            type="email"
            placeholder="tu@email.com"
            autocomplete="email"
            formControlName="email"
            [hasError]="emailInvalid()"
            testId="login-email-input"
          />
        </ds-form-field>

        <ds-form-field
          label="Contraseña" i18n-label="@@login.password.label"
          inputId="login-password"
          [hasError]="passwordInvalid()"
          errorMessage="Mínimo 6 caracteres" i18n-errorMessage="@@login.password.error"
        >
          <ds-input
            inputId="login-password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            formControlName="password"
            [hasError]="passwordInvalid()"
            testId="login-password-input"
          />
        </ds-form-field>

        @if (error()) {
          <div class="login__error" role="alert" data-testid="login-error">
            {{ error() }}
          </div>
        }

        <ds-button
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="loading()"
          data-testid="login-submit-button"
        >{{ submitLabel() }}</ds-button>
      </form>

      <a class="login__back" routerLink="/" data-testid="login-back-link" i18n="@@login.back">
        ← Volver a la web
      </a>

    </div>
  </div>

</div>
