<section class="hero" id="hero" data-testid="hero-section">
  <div class="hero__bg" aria-hidden="true">
    <div class="hero__spotlight"></div>
    <div class="hero__grid"></div>
  </div>

  <img
    class="hero__watermark"
    [src]="logoSrc()"
    alt=""
    aria-hidden="true"
  />

  <div class="hero__content">
    <p class="hero__eyebrow" data-testid="hero-eyebrow">
      <span class="hero__eyebrow-line" aria-hidden="true"></span>
      {{ subtitle() }}
    </p>

    <h1 class="hero__headline" data-testid="hero-headline">
      <span class="hero__headline-top">{{ headlineTop() }}</span>
      <span class="hero__headline-main">{{ headlineMain() }}</span>
    </h1>

    <p class="hero__tagline" data-testid="hero-tagline">{{ tagline() }}</p>

    <div class="hero__actions">
      <a class="hero__btn hero__btn--primary" href="#classes">Ver clases</a>
      <a class="hero__btn hero__btn--ghost" href="#contact">Contáctanos</a>
    </div>
  </div>

  <div class="hero__scroll-hint" aria-hidden="true">
    <span></span>
  </div>
</section>
