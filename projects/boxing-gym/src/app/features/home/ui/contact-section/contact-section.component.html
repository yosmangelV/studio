<section class="contact" id="contact" data-testid="contact-section">
  <div class="contact__container">
    <div class="contact__header">
      <ds-section-header
        eyebrow="Estamos aquí" i18n-eyebrow="@@contact.eyebrow"
        title="Contác" i18n-title="@@contact.title"
        titleAccent="tanos" i18n-titleAccent="@@contact.titleAccent"
        titleSeparator=""
        align="center"
      />
    </div>

    <a
      class="contact__whatsapp"
      [href]="'https://wa.me/' + contact().whatsapp.replace(/\D/g, '')"
      target="_blank"
      rel="noopener noreferrer"
      data-testid="contact-whatsapp"
    >
      <span aria-hidden="true">💬</span>
      <span i18n="@@contact.whatsapp">Escríbenos por WhatsApp</span>
    </a>

    <ul class="contact__details" role="list">
      <li class="contact__item">
        <span class="contact__label" i18n="@@contact.phone.label">Teléfono</span>
        <a class="contact__value" [href]="'tel:' + contact().phone">{{ contact().phone }}</a>
      </li>
      <li class="contact__item">
        <span class="contact__label" i18n="@@contact.email.label">Email</span>
        <a class="contact__value" [href]="'mailto:' + contact().email">{{ contact().email }}</a>
      </li>
      <li class="contact__item">
        <span class="contact__label" i18n="@@contact.address.label">Dirección</span>
        <span class="contact__value">{{ contact().address }}</span>
      </li>
      @if (contact().instagram) {
        <li class="contact__item">
          <span class="contact__label" i18n="@@contact.instagram.label">Instagram</span>
          <a
            class="contact__value"
            [href]="'https://instagram.com/' + contact().instagram!.replace('@', '')"
            target="_blank"
            rel="noopener noreferrer"
          >{{ contact().instagram }}</a>
        </li>
      }
    </ul>
  </div>

  <footer class="footer">
    <p class="footer__copy">{{ copyright() }}</p>
  </footer>
</section>
