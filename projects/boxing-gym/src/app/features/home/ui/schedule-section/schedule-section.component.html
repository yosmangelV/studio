<section class="schedule" id="schedule" data-testid="schedule-section">
  <div class="schedule__container">
    <div class="schedule__header">
      <ds-section-header title="Horarios" i18n-title="@@schedule.title" align="center" />
    </div>

    <ul class="schedule__list" role="list">
      @for (group of schedule(); track group.days) {
        <li class="schedule__row" [class.schedule__row--closed]="group.closed" data-testid="schedule-group">
          <span class="schedule__day">{{ group.days }}</span>
          <ul class="schedule__sessions" role="list">
            @for (session of group.sessions; track $index) {
              <li class="schedule__session">
                @if (session.label) {
                  <span class="schedule__label">{{ session.label }}</span>
                }
                <span class="schedule__time">{{ session.time }}</span>
              </li>
            }
          </ul>
        </li>
      }
    </ul>
  </div>
</section>
