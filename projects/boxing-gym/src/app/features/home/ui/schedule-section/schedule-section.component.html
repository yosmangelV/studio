<section class="schedule" id="schedule" data-testid="schedule-section">
  <div class="schedule__container">
    <div class="schedule__header">
      <ds-section-header title="Horarios" i18n-title="@@schedule.title" align="center" />
    </div>

    <ul class="schedule__list" role="list">
      @for (entry of schedule(); track entry.day) {
        <li class="schedule__row" [class.schedule__row--closed]="entry.closed">
          <span class="schedule__day">{{ entry.day }}</span>
          <span class="schedule__separator" aria-hidden="true"></span>
          <span class="schedule__time">{{ entry.time }}</span>
        </li>
      }
    </ul>
  </div>
</section>
