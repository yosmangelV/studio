<section class="about" id="about" data-testid="about-section">
  <div class="about__container">
    <div class="about__header">
      <ds-section-header eyebrow="Quiénes somos" title="Sobre" titleAccent="Nosotros" />
    </div>

    <div class="about__visual" aria-hidden="true">
      <img class="about__image" [src]="logoSrc()" alt="" />
    </div>

    <div class="about__body">
      <p class="about__text">{{ about() }}</p>

      <ul class="about__highlights" role="list">
        @for (item of highlights(); track item.label) {
          <li class="about__highlight">
            <span class="about__highlight-value">{{ item.value }}</span>
            <span class="about__highlight-label">{{ item.label }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
