<button
  class="locale-switcher"
  type="button"
  data-testid="locale-switcher-btn"
  [attr.aria-label]="'Cambiar idioma a ' + alternateLabel.label + ' (' + alternateLabel.code + ')'"
  (click)="switchLocale()"
>
  <lucide-angular [img]="icons.language" [size]="16" aria-hidden="true" />
  <span class="locale-switcher__code" aria-hidden="true">{{ alternateLabel.code }}</span>
  <span class="locale-switcher__label">{{ alternateLabel.label }}</span>
</button>
