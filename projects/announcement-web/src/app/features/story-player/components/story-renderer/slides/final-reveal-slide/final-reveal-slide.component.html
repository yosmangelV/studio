<div class="final-reveal-slide">
  <lucide-angular class="final-reveal-slide__heart" [img]="heartIcon" [size]="48" [strokeWidth]="1.75" aria-hidden="true" />

  <div class="final-reveal-slide__banner">
    <h1 class="final-reveal-slide__title">{{ data().title }}</h1>
  </div>
  <figure class="final-reveal-slide__photo" [class.is-loading]="!imageLoaded()">
    <img [src]="data().image" [alt]="data().altText" (load)="imageLoaded.set(true)" />
  </figure>
  <p class="final-reveal-slide__subtitle">{{ data().body }}</p>

  <p class="final-reveal-slide__message">{{ data().footer}}</p>
</div>
