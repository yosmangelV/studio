<div class="ultrasound-slide">
  <div class="ultrasound-slide__content">
    <figure class="ultrasound-slide__photo" [class.is-loading]="!imageLoaded()">
      <img [src]="data().image" [alt]="data().altText" (load)="imageLoaded.set(true)" />
    </figure>

    <p class="ultrasound-slide__title">{{ data().title }}</p>
    <p class="ultrasound-slide__body">{{ data().body }}</p>
    <p class="ultrasound-slide__footer">{{ data().footer }}</p>
  </div>
</div>
