<div class="text-slide">
  @if (data()?.title) {
    <p class="text-slide__eyebrow">{{ data()?.title }}</p>
  }
  @if (data().body) {
    <h1 class="text-slide__title">{{ data().body }}</h1>
  }
  <p class="text-slide__body">
    @if (data()?.footer) {
      {{ data().footer.replace(data().footer!, '') }}
      <em class="text-slide__emphasis">{{ data().footer }}</em>
    } @else {
      {{ data().footer }}
    }
  </p>
</div>
