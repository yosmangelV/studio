@if (imageUrl(); as src) {
  <figure class="image-slide" [class.is-loading]="!imageLoaded()">
    <img
      class="image-slide__img"
      data-testid="announcement-slide-image"
      [src]="src"
      [alt]="altText()"
      (load)="imageLoaded.set(true)"
    />
    @if (caption(); as text) {
      <figcaption class="image-slide__caption" data-testid="announcement-slide-caption">{{ text }}</figcaption>
    }
  </figure>
} @else {
  <app-text-slide [slide]="slide()" />
}
