<div class="envelope-slide">
  <div class="envelope-slide__bg"></div>

  <div class="envelope-slide__content">
    @if (data().title) {
      <p class="envelope-slide__title">{{ data().title }}</p>
    }
    @if (data().body) {
      <p class="envelope-slide__body">{{ data().body }}</p>
    }
    @if (data().emphasis) {
      <em class="envelope-slide__emphasis">{{ data().emphasis }}</em>
    }

    <div class="envelope-slide__icon" aria-hidden="true">✉️</div>
  </div>
</div>
