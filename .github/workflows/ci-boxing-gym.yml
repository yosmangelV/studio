name: CI — Boxing Gym

on:
  push:
    branches: [main]
    paths:
      - 'projects/boxing-gym/**'
      - 'projects/design-system/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'projects/boxing-gym/**'
      - 'projects/design-system/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate environment files
        run: npx nx generate-env boxing-gym
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          API_URL: http://localhost:8000

      - name: Test boxing-gym
        run: npx nx test boxing-gym --watch=false
