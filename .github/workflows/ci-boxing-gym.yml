name: CI — Boxing Gym

on:
  push:
    branches: [main]
    paths:
      - 'projects/boxing-gym/**'
      - 'projects/design-system/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'projects/boxing-gym/**'
              - 'projects/design-system/**'
              - 'package.json'
              - 'package-lock.json'

  test:
    name: Boxing Gym test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate environment files
        run: npx nx generate-env boxing-gym
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          API_URL: http://localhost:8000

      - name: Check boxing-gym contrast and token usage
        run: node projects/design-system/scripts/check-contrast.mjs projects/boxing-gym/contrast.config.json

      - name: Test boxing-gym
        run: npx nx test boxing-gym --watch=false
