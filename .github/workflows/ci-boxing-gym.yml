name: CI — Boxing Gym

on:
  push:
    branches: [main]
    paths:
      - 'projects/boxing-gym/**'
      - 'projects/design-system/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            relevant:
              - 'projects/boxing-gym/**'
              - 'projects/design-system/**'
              - 'package.json'
              - 'package-lock.json'

  test:
    name: Boxing Gym test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate environment files
        run: npx nx generate-env boxing-gym
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          API_URL: http://localhost:8000

      - name: Check boxing-gym contrast and token usage
        run: node projects/design-system/scripts/check-contrast.mjs projects/boxing-gym/contrast.config.json

      - name: Test boxing-gym
        run: npx nx test boxing-gym --watch=false
