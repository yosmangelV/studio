name: CI — Design System

on:
  push:
    branches: [main]
    paths:
      - 'projects/design-system/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'projects/design-system/**'
              - 'package.json'
              - 'package-lock.json'

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check design-system contrast and token usage
        run: node projects/design-system/scripts/check-contrast.mjs projects/design-system/contrast.config.json

      - name: Test design-system
        run: npx nx test design-system --watch=false
