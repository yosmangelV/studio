name: CI — Announcement Web

on:
  push:
    branches: [main]
    paths:
      - 'projects/announcement-web/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'projects/announcement-web/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test announcement-web
        run: npx nx test announcement-web --watch=false
