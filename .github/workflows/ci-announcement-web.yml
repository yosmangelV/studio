name: CI — Announcement Web

on:
  push:
    branches: [main]
    paths:
      - 'projects/announcement-web/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'projects/announcement-web/**'
              - 'package.json'
              - 'package-lock.json'

  test:
    name: Announcement Web test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test announcement-web
        run: npx nx test announcement-web --watch=false
