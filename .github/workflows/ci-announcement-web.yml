name: CI — Announcement Web

on:
  push:
    branches: [main]
    paths:
      - 'projects/announcement-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-announcement-web.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            relevant:
              - 'projects/announcement-web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci-announcement-web.yml'

  test:
    name: Announcement Web test (run)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test announcement-web
        run: npx nx test announcement-web --watch=false

  # Required status check. GitHub accepts a skipped required check as passing,
  # so `test` (skipped when nothing relevant changed, or when `changes` fails)
  # cannot be the required check itself. This job always runs and keeps the
  # name branch protection requires: renaming it blocks merges.
  gate:
    name: Announcement Web test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the tests to pass or to be unneeded
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST: ${{ needs.test.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The changes filter did not succeed (result: $CHANGES)."
            exit 1
          fi
          if [ "$RELEVANT" = "true" ] && [ "$TEST" = "success" ]; then
            exit 0
          fi
          if [ "$RELEVANT" = "false" ] && [ "$TEST" = "skipped" ]; then
            echo "No relevant changes; tests not needed."
            exit 0
          fi
          echo "::error::Unexpected state (relevant: $RELEVANT, test: $TEST)."
          exit 1
