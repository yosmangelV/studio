name: CI — Boxing Gym API

on:
  push:
    branches: [main]
    paths:
      - 'apps/boxing-gym-api/**'
      - '.github/workflows/ci-boxing-gym-api.yml'
  pull_request:
    branches: [main]

# A new push to a PR cancels the run it supersedes. Every other run (pushes to
# main, manual runs) is grouped by its own commit, so it never waits or gets
# cancelled: GitHub drops a pending run when a third one joins its group, and main
# is the deploy and the Chromatic baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'apps/boxing-gym-api/**'
              - '.github/workflows/ci-boxing-gym-api.yml'

  test:
    name: Boxing Gym API test (run)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/boxing-gym-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/boxing-gym-api/uv.lock

      - name: Migrations never write user data
        run: python3 scripts/check_migrations.py

      - run: uv sync --locked

      # app.config reads these at import time. Tests mock Supabase, so
      # placeholders are enough and nothing reaches a real project.
      - name: Test boxing-gym-api
        run: uv run pytest
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_JWKS_URL: https://placeholder.supabase.co/auth/v1/.well-known/jwks.json

  # Required status check. GitHub accepts a skipped required check as passing,
  # so `test` (skipped when nothing relevant changed, or when `changes` fails)
  # cannot be the required check itself. This job always runs and keeps the
  # name branch protection requires: renaming it blocks merges.
  gate:
    name: Boxing Gym API test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the tests to pass or to be unneeded
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST: ${{ needs.test.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The changes filter did not succeed (result: $CHANGES)."
            exit 1
          fi
          if [ "$RELEVANT" = "true" ] && [ "$TEST" = "success" ]; then
            exit 0
          fi
          if [ "$RELEVANT" = "false" ] && [ "$TEST" = "skipped" ]; then
            echo "No relevant changes; tests not needed."
            exit 0
          fi
          echo "::error::Unexpected state (relevant: $RELEVANT, test: $TEST)."
          exit 1
