[project]
name = "boxing-gym-api"
version = "0.1.0"
description = "Backend de gestión para escuela de boxeo — FastAPI + Supabase"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124.4",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.8.1",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.6.0",
    "uvicorn[standard]>=0.33.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]
